name: One-shot oversized artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-browser-artifacts.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete verified oversized Playwright artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact_id in 9323178008 9323164999; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            echo "Deleted artifact ${artifact_id}"
          done

      - name: Remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_path='.github/workflows/cleanup-old-browser-artifacts.yml'
          workflow_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${GITHUB_REF_NAME}" --jq .sha)"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message='chore(ci): remove completed artifact cleanup' \
            -f sha="${workflow_sha}" \
            -f branch="${GITHUB_REF_NAME}"
