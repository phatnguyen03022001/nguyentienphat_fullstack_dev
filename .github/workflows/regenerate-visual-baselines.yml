name: Regenerate visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@10.9.7

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &

          node <<'NODE'
          const url = 'http://127.0.0.1:4173/';
          const deadline = Date.now() + 30000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            while (Date.now() < deadline) {
              try {
                const response = await fetch(url);

                if (response.ok) {
                  process.exit(0);
                }
              } catch {}

              await sleep(500);
            }

            console.error('Preview server did not become ready.');

            process.exit(1);
          })();
          NODE

      - name: Regenerate visual baselines
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/visual.spec.js --update-snapshots

      - name: Commit regenerated baselines and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            tests/__screenshots__ \
            .github/workflows/regenerate-visual-baselines.yml

          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi

          git commit -m "chore(ci): regenerate visual regression baselines"
          git push
