name: Browser Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        env:
          PLAYWRIGHT_BASE_URL: https://ntp-portfolio-neon.vercel.app/
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: test-results/
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Lighthouse
        run: |
          npx --yes lighthouse https://ntp-portfolio-neon.vercel.app/ \
            --output=html \
            --output=json \
            --output-path=./reports/lighthouse \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo

      - name: Check Lighthouse scores
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('./reports/lighthouse.report.json', 'utf8'));
          const scores = Object.fromEntries(
            Object.entries(report.categories).map(([key, value]) => [key, value.score ?? 0])
          );
          console.log(scores);
          const thresholds = { performance: 0.9, accessibility: 0.95, 'best-practices': 0.95, seo: 0.95 };
          for (const [key, min] of Object.entries(thresholds)) {
            if ((scores[key] ?? 0) < min) {
              console.error(`Lighthouse gate failed: ${key}=${scores[key]} < ${min}`);
              process.exit(1);
            }
          }
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/
          if-no-files-found: error
