name: Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.7

      - name: Install
        run: npm ci --ignore-scripts

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Portfolio contract
        run: npm run verify

      - name: Build
        run: npm run build
