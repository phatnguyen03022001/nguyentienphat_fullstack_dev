name: One-time quality bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &
          node <<'NODE'
          const url = 'http://127.0.0.1:4173/';
          const deadline = Date.now() + 30000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            while (Date.now() < deadline) {
              try {
                const response = await fetch(url);
                if (response.ok) process.exit(0);
              } catch {}
              await sleep(500);
            }
            console.error('Preview server did not become ready.');
            process.exit(1);
          })();
          NODE

      - name: Generate visual baselines
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/visual.spec.js --update-snapshots

      - name: Switch CI to npm ci
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              '.github/workflows/quality.yml': [
                  ('npm install --ignore-scripts', 'npm ci --ignore-scripts'),
              ],
              '.github/workflows/browser-quality.yml': [
                  ('npm install', 'npm ci'),
              ],
          }
          for path, pairs in replacements.items():
              file = Path(path)
              text = file.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              file.write_text(text)
          PY

      - name: Remove bootstrap workflow
        run: rm .github/workflows/one-time-quality-bootstrap.yml

      - name: Commit quality bootstrap results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json tests/__screenshots__ .github/workflows/quality.yml .github/workflows/browser-quality.yml .github/workflows/one-time-quality-bootstrap.yml
          git commit -m "ci: add lockfile and visual regression baselines"
          git push
